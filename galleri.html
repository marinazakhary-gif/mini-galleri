<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleri | Mitt bildgalleri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Huvudmeny">
      <a href="index.html">Startsida</a>
      <a href="galleri.html" aria-current="page">Galleri</a>
    </nav>
  </header>

  <main>
    <h1>Bildgalleri</h1>
    <p>Här är några bilder från naturen.</p>
    <section class="gallery" aria-label="Naturbilder">
      <figure>
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1000&q=85"
          alt="Grön bergssjö omgiven av höga berg">
        <figcaption>En sjö bland bergen</figcaption>
      </figure>
      <figure>
        <img
          src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85"
          alt="Soluppgång över ett landskap med dimma">
        <figcaption>Soluppgång över landskapet</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Mitt bildgalleri</p>
  </footer>
</body>
</html>
